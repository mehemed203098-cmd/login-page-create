<html lang="en">
<head>

    <style>
@import url('https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Azeret+Mono:ital,wght@0,100..900;1,100..900&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap');

<link rel="stylesheet"

<body>
    <div class="container">
        <h1>Login</h1>
    <form action="">
            <div class="from-group">
                <input type="email" placeholder="Email" required>
                <label for="">Email</label>
                <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="from-group">
                
                <input type="password" placeholder="Password" required>
                <label for="">Password</label>
                <i class="fa-solid fa-lock"></i>
            </div>      
            <div>
                <p><input type="checkbox"> Remember me <a href="#">Forgot Password?</a></p>
                
                <button>Login</button>
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>
        
    </form>
</div>
